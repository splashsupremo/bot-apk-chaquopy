workflows:
  android-chaquopy-build:
    name: Android Chaquopy Build
    max_build_duration: 45
    environment:
      java: 11  # Use default supported version
    scripts:
      - name: Make Gradle executable
        script: |
          chmod +x ./gradlew
      - name: Build APK
        script: |
          ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - fashanuhu@gmail.com
        notify:
          success: true
          failure: true
