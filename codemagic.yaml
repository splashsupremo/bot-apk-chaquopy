workflows:
  android-chaquopy-build:
    name: Android Chaquopy Build
    max_build_duration: 45
    environment:
      vars:
        JAVA_HOME: /usr/lib/jvm/java-11-openjdk
    scripts:
      - name: Make Gradle executable
        script: |
          chmod +x ./gradlew
      - name: Build APK
        script: |
          ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - fashglobaltech@gmail.com
        notify:
          success: true
          failure: true
